# Supabase pauses free projects after a week with no activity. One tiny request a day prevents that.
# Add repository secrets SUPABASE_URL and SUPABASE_ANON_KEY (Settings > Secrets and variables > Actions).
name: Keep Supabase awake
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/ping" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" -H "Content-Type: application/json" -d '{}'
